[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monorag"
version = "0.1.0"
description = "Sistema de Recuperación Aumentada por Generación (RAG) para documentos técnicos"
requires-python = ">=3.10"
dependencies = [
    "chromadb==1.5.8",
    "sentence-transformers==5.4.1",
    "openai==2.33.0",
    "pdfplumber==0.11.9",
    "python-dotenv==1.2.2",
    "rank_bm25==0.2.2",
    "rich==15.0.0",
    "fastmcp==3.2.4",
]

[project.scripts]
monorag = "cli:main"
monorag-mcp = "rag_core.mcp_server:main"

[project.optional-dependencies]
test = [
    "pytest==8.3.5",
    "hypothesis==6.131.0",
]

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["rag_core*"]

[tool.pytest.ini_options]
norecursedirs = [
    ".git",
    ".hypothesis",
    ".pytest_cache",
    ".pytest_tmp",
    ".test-artifacts",
    ".test-tmp",
    "__pycache__",
    "chroma_db",
    "manual-temp",
    "monorag.egg-info",
    "test-tmp",
    "venv",
]
